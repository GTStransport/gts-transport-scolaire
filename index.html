<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2d4d" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="description" content="Gestion Transport Scolaire - transport scolaire specialise" />
    <title>Gestion Transport Scolaire</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=20260522-responsive-01" />
    <script src="/firebase-config.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (error) {
            console.warn("Service worker indisponible", error);
          });
        });
      }
      window.renderGtsFallback = function () {
        var root = document.getElementById("root");
        if (
          !root ||
          root.querySelector(".landing-page") ||
          root.querySelector(".app-shell") ||
          root.querySelector(".premium-login-screen") ||
          root.querySelector(".app-selector-screen") ||
          root.querySelector(".login-form input:not([disabled])")
        ) return;
        root.innerHTML = `
          <main class="premium-login-screen">
            <section class="premium-login-panel">
              <div class="premium-lock-icon">🔐</div>
              <div class="login-copy">
                <h1>Connexion</h1>
                <p>Accédez à votre espace en sélectionnant votre profil</p>
              </div>
              <p class="premium-profile-title">Sélectionnez votre profil</p>
              <div class="premium-profile-grid">
                <div class="premium-profile-card"><span class="premium-profile-icon">🛡</span><strong>Administrateur système</strong><small>Configuration et sécurité globales</small></div>
                <div class="premium-profile-card"><span class="premium-profile-icon">▦</span><strong>Gestionnaire de transport</strong><small>Gestion opérationnelle terrain</small></div>
                <div class="premium-profile-card tone-green"><span class="premium-profile-icon">🏛</span><strong>SPW</strong><small>Supervision et suivi global</small></div>
                <div class="premium-profile-card tone-orange"><span class="premium-profile-icon">☸</span><strong>Chauffeur</strong><small>Gestion des trajets et transport</small></div>
                <div class="premium-profile-card tone-violet"><span class="premium-profile-icon">●</span><strong>Convoyeuse</strong><small>Suivi et accompagnement</small></div>
                <div class="premium-profile-card tone-turquoise"><span class="premium-profile-icon">👥</span><strong>Parents</strong><small>Suivi des enfants et notifications</small></div>
              </div>
            </section>
          </main>`;
      };
      window.addEventListener("error", function () {
        setTimeout(window.renderGtsFallback, 0);
      });
      window.addEventListener("unhandledrejection", function () {
        setTimeout(window.renderGtsFallback, 0);
      });
      setTimeout(window.renderGtsFallback, 5000);
    </script>
  </head>
  <body>
    <div id="root">
      <main class="premium-login-screen">
        <section class="premium-login-panel">
          <div class="premium-lock-icon">🔐</div>
          <div class="login-copy">
            <h1>Connexion</h1>
            <p>Chargement de votre espace...</p>
          </div>
        </section>
      </main>
    </div>
  <script type="module" src="/app.js?v=20260522-responsive-01"></script>
  </body>
</html>
