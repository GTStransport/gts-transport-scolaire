<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2d4d" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="description" content="Gestion Transport Scolaire - transport scolaire specialise" />
    <title>Gestion Transport Scolaire</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=20260525-gts-icon" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260525-gts-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260525-gts-icon" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260525-gts-icon" />
    <link rel="stylesheet" href="/styles.css?v=20260527-login-icons-02" />
    <script src="/firebase-config.js"></script>
    <script>
      (function () {
        var isStandalonePwa = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
        isStandalonePwa = isStandalonePwa || window.navigator.standalone === true;
        if (!isStandalonePwa) return;
        var reloadKey = "gts-pwa-launch-reloaded";
        var url = new URL(window.location.href);
        if (url.searchParams.has("pwaRefresh")) {
          url.searchParams.delete("pwaRefresh");
          window.history.replaceState({}, "", url.pathname + url.search + url.hash);
          return;
        }
        if (sessionStorage.getItem(reloadKey) === "1") return;
        sessionStorage.setItem(reloadKey, "1");
        url.searchParams.set("pwaRefresh", String(Date.now()));
        window.location.replace(url.toString());
      })();

      if ("serviceWorker" in navigator) {
        var isLocalDev = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        if (isLocalDev) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }).then(function () {
            if (navigator.serviceWorker.controller && !sessionStorage.getItem("gts-sw-local-cleared")) {
              sessionStorage.setItem("gts-sw-local-cleared", "1");
              window.location.reload();
            }
          }).catch(function (error) {
            console.warn("Nettoyage service worker local impossible", error);
          });
        } else {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function (error) {
              console.warn("Service worker indisponible", error);
            });
          });
        }
      }
      window.renderGtsFallback = function () {
        var root = document.getElementById("root");
        if (
          !root ||
          root.querySelector(".legal-page") ||
          root.querySelector(".landing-page") ||
          root.querySelector(".app-shell") ||
          root.querySelector(".premium-login-screen") ||
          root.querySelector(".app-selector-screen") ||
          root.querySelector(".login-form input:not([disabled])")
        ) return;
        root.innerHTML = `
          <main class="premium-login-screen">
            <section class="premium-login-panel">
              <div class="premium-lock-icon login-brand-logo">
                <img src="/assets/gts-bookmark-source.jpg" alt="Gestion Transport Scolaire">
              </div>
              <div class="login-copy">
                <h1>Connexion</h1>
              </div>
              <p class="premium-profile-title">Sélectionnez votre profil</p>
              <div class="premium-profile-grid">
                <div class="premium-profile-card" data-login-profile="transport_manager"><span class="premium-profile-icon"><svg viewBox="0 0 24 24"><path d="M4.5 15V8c0-1.2 1-2.2 2.2-2.2h7.6c1.2 0 2.2 1 2.2 2.2v7"></path><path d="M6 11h9"></path><path d="M7.2 18a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"></path><path d="M13.8 18a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"></path><path d="M7 8.4h7"></path><path d="M19.4 20v-1.1a2.3 2.3 0 0 0-2.3-2.3"></path><path d="M17.1 13.8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg></span><strong>Transporteur</strong></div>
                <div class="premium-profile-card tone-orange"><span class="premium-profile-icon"><svg viewBox="0 0 24 24"><path d="M4.5 15.5V7.8c0-1.3 1-2.3 2.3-2.3h10.4c1.3 0 2.3 1 2.3 2.3v7.7"></path><path d="M6.2 11.2h11.6"></path><path d="M8 18.3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path><path d="M16 18.3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path><path d="M8 8.5h4.3"></path><path d="M15.2 8.9a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"></path></svg></span><strong>Chauffeurs</strong></div>
                <div class="premium-profile-card tone-green"><span class="premium-profile-icon"><svg viewBox="0 0 24 24"><path d="m3.5 9 8.5-5 8.5 5"></path><path d="M5 9h14"></path><path d="M7 9v8"></path><path d="M11 9v8"></path><path d="M15 9v8"></path><path d="M19 19H5"></path></svg></span><strong>SPW</strong></div>
                <div class="premium-profile-card tone-violet"><span class="premium-profile-icon"><svg viewBox="0 0 24 24"><path d="M9 9.5a2.7 2.7 0 1 0 0-5.4 2.7 2.7 0 0 0 0 5.4Z"></path><path d="M4.5 20v-1.8A4.5 4.5 0 0 1 9 13.7h.4"></path><path d="M16.2 12.2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path><path d="M12.4 20v-.9a3.8 3.8 0 0 1 7.6 0v.9"></path><path d="M19.2 8.2h2.1"></path><path d="M20.25 7.1v2.1"></path></svg></span><strong>Convoyeuses</strong></div>
                <div class="premium-profile-card tone-turquoise"><span class="premium-profile-icon"><svg viewBox="0 0 24 24"><path d="M8 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path><path d="M16 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path><path d="M3.5 20a4.5 4.5 0 0 1 9 0"></path><path d="M11.5 20a4.5 4.5 0 0 1 9 0"></path></svg></span><strong>Parents</strong></div>
              </div>
            </section>
          </main>`;
      };
      window.addEventListener("error", function () {
        setTimeout(window.renderGtsFallback, 0);
      });
      window.addEventListener("unhandledrejection", function () {
        setTimeout(window.renderGtsFallback, 0);
      });
      setTimeout(window.renderGtsFallback, 5000);
    </script>
  </head>
  <body>
    <div id="root">
      <main class="premium-login-screen">
        <section class="premium-login-panel">
          <div class="premium-lock-icon login-brand-logo">
            <img src="/assets/gts-bookmark-source.jpg" alt="Gestion Transport Scolaire">
          </div>
          <div class="login-copy">
            <h1>Connexion</h1>
            <p>Chargement de votre espace...</p>
          </div>
        </section>
      </main>
    </div>
  <script type="module" src="/app.js?v=20260527-login-icons-02"></script>
  </body>
</html>
